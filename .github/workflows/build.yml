name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "upstream/**"
      - "README.md"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Check the jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "Jar: $JAR ($(du -h "$JAR" | cut -f1))"
          unzip -l "$JAR" | tail -1
          unzip -p "$JAR" fabric.mod.json
          if unzip -Z1 "$JAR" | grep -iE "\.(ps1|vbs|bat|cmd|exe|dll|so|dylib|sh|jar)$"; then
            echo "::error::Scripts, executables or nested jars found in the jar"; exit 1
          fi
          echo "No scripts, executables or nested jars in the jar."
          mkdir -p /tmp/jarcheck && unzip -q -o "$JAR" 'dev/*' -d /tmp/jarcheck
          if grep -rlaiE "discord\.com|discordapp|discord-ipc|mojang\.com|lrclib|textdb|powershell" /tmp/jarcheck/dev; then
            echo "::error::Removed services (Discord, Mojang, lrclib, textdb, PowerShell) found in Copium's code"; exit 1
          fi
          echo "No Discord, Mojang, lrclib, textdb or PowerShell in Copium's code."

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: copium-client
          path: build/libs/*.jar

      - name: Publish as the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          cp "$JAR" copium-client-1.21.11.jar
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest copium-client-1.21.11.jar \
            --title "Copium Client (latest build)" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Fabric 1.21.11, needs Fabric API." \
            --prerelease --target "$GITHUB_SHA"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
