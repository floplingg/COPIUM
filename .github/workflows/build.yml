name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "upstream/**"
      - "README.md"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: copium-client
          path: build/libs/*.jar

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
